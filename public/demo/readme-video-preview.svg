<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Artist Portfolio Demo Video</title>
  <desc id="desc">Click to play the portfolio demo video.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c0f1c"/>
      <stop offset="45%" stop-color="#1a253b"/>
      <stop offset="100%" stop-color="#07111f"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="22" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="290" cy="230" r="260" fill="#3ab2ff" fill-opacity="0.14"/>
  <circle cx="1280" cy="690" r="300" fill="#ff3f8f" fill-opacity="0.10"/>
  <rect x="72" y="72" width="1456" height="756" rx="36" fill="#000000" fill-opacity="0.34" stroke="#ffffff" stroke-opacity="0.16"/>
  <rect x="92" y="92" width="1416" height="716" rx="30" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.10"/>

  <text x="140" y="208" fill="#ffffff" font-size="70" font-weight="700" font-family="Segoe UI, Arial, sans-serif" letter-spacing="1.5">ARTIST PORTFOLIO DEMO</text>
  <text x="140" y="270" fill="#c9d5e8" font-size="33" font-weight="500" font-family="Segoe UI, Arial, sans-serif">
    Video nen - Filmography hover preview - Motion UI showcase
  </text>

  <g transform="translate(800 520)" filter="url(#softGlow)">
    <circle cx="0" cy="0" r="110" fill="#ffffff" fill-opacity="0.16" stroke="#ffffff" stroke-opacity="0.35"/>
    <circle cx="0" cy="0" r="88" fill="#ffffff" fill-opacity="0.26" stroke="#ffffff" stroke-opacity="0.55"/>
    <polygon points="-18,-36 46,0 -18,36" fill="#ffffff"/>
  </g>

  <rect x="140" y="692" width="336" height="64" rx="32" fill="#ffffff" fill-opacity="0.18" stroke="#ffffff" stroke-opacity="0.35"/>
  <text x="200" y="735" fill="#ffffff" font-size="30" font-weight="700" font-family="Segoe UI, Arial, sans-serif">CLICK TO PLAY</text>
</svg>
